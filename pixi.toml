[workspace]
authors = ["Lukas Adam <gm.lukas.adam@gmail.com>"]
channels = ["conda-forge"]
name = "besca_sc"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
test = { cmd = "pytest", env = { PYTHONNOUSERSITE = "1" } }
lint = "ruff check ."

[dependencies]
python = "3.12.*"
anndata = ">=0.13.4,<0.14"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
plotnine = ">=0.15.8,<0.16"

[feature.dev.pypi-dependencies]
pre-commit = "*"
pytest = ">=9.1.1, <10"
ruff = ">=0.17.1, <0.18"
build = ">=1.6.1, <2"
mkdocs-material = ">=9.7.7, <10"
mkdocstrings-python = ">=2.0.9, <3"
hatch = ">=1.18.1, <2"

[feature.dev.dependencies]
loguru = ">=0.7.3,<0.8"
scanpy = "*"

[feature.sc.dependencies]
scanpy = "*"

[feature.sc.pypi-dependencies]
mygene = ">=3.2.2, <4"

[environments]
dev = ["dev"]
sc = ["sc"]
