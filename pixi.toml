[workspace]
authors = ["Lukas Adam <gm.lukas.adam@gmail.com>"]
channels = ["conda-forge"]
name = "besca_sc"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
test = "pytest"
lint = "ruff check ."

[dependencies]
python = "3.12.*"
anndata = ">=0.13.4,<0.14"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
plotnine = ">=0.15.8,<0.16"

[feature.dev.pypi-dependencies]
pre-commit = "*"
versionner = ">=1.5.3, <2"
pytest = ">=9.1.1, <10"
ruff = ">=0.17.1, <0.18"
build = ">=1.6.1, <2"

[feature.sc.dependencies]
scanpy = "*"

[environments]
dev = ["dev"]
sc = ["sc"]
