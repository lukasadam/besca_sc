name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true
          frozen: true

      - name: Lint
        run: pixi run lint

      - name: Test
        run: pixi run test