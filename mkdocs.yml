site_name: besca_sc
site_description: Single-cell analysis utilities

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table

            # Show Python signatures with types
            show_signature: true
            show_signature_annotations: true
            separate_signature: true

            # API organization
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            filters:
              - "!^_"

            # Source code
            show_source: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: api.md
  - Development:
      - Pixi Cheat Sheet: PIXI_CHEATSHEET.md
      - Git Cheat Sheet: GIT_CHEATSHEET.md
