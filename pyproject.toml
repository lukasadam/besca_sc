[project]
authors = [{name = "Lukas Adam", email = "gm.lukas.adam@gmail.com"}]
dependencies = ["loguru>=0.7.3,<0.8", "scikit-misc>=0.5.1,<0.6"]
name = "besca_sc"
requires-python = ">= 3.11"
dynamic = ["version"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
besca_sc = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/besca_sc/_version.py"

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "F",    # Pyflakes
    "D",    # Docstring conventions
]

[tool.ruff]
exclude = ["notebooks"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
pythonpath = ["src"]
